experiment: emt_10d
seed: 11
data:
  path: data/real/emt_10d.csv
  time_column: samples
  dimension: 10
model:
  hidden_dim: 256
  hidden_layers: 5
  activation: leakyrelu
transport:
  delta: 2.0
  bandwidth: 0.0
  mini_batch: false
  chunk_size: 1500
training:
  epochs: 3000
  batch_size: 256
  learning_rate: 0.005
  lambda_growth: 20.0
  p_diff: 0.05
  weight_decay: 0.0
  log_every: 50
